<script>
const $=s=>document.querySelector(s),K='pastillas.v1',pad=n=>String(n).padStart(2,'0');
const DN=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'],DS=['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'],DL=['L','M','X','J','V','S','D'],

const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),dow=d=>(d.getDay()+6)%7,same=(a,b)=>key(a)===key(b),
add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},parse=v=>{const[y,m,d]=v.split('-');return new Date(+y,m-1,+d)},

const SL={m:'Mañana',t:'Tarde',n:'Noche'},SO=['m','t','n'],DT={m:'09:00',t:'15:00',n:'21:00'};
function slotOf(t){const h=+t.split(':')[0];return h<12?'m':h<20?'t':'n'}

const PUSH=window.PUSH_CFG||{url:'PEGA_URL_DEL_WORKER',key:'PEGA_CLAVE_PUBLICA'},PUSHOK=!NAT&&'PushManager'in window&&!PUSH.url.startsWith('PEGA')&&!PUSH.key.startsWith('PEGA');
function load(){let s;try{s=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!s||!s.meds){const a=[0,1,2,3,4,5,6];s={start:key(today),done:{},meds:[{id:'a1',n:'Vitamina D',t:'09:00',d:a},{id:'a2',n:'Hierro',t:'09:30',d:[0,2,4]},{id:'a3',n:'Vitamina B12',t:'10:00',d:[1,3]},{id:'a4',n:'Omega 3',t:'14:00',d:[0,1,3,5]},{id:'a5',n:'Calcio',t:'20:00',d:[3,5,6]},{id:'a6',n:'Magnesio',t:'22:00',d:a}]}}
s.cfg=Object.assign({rem:false},s.cfg);s.cfg.times=Object.assign({},DT,s.cfg.times);

const medsFor=d=>S.meds.filter(m=>m.d.includes(dow(d))).sort((a,b)=>SO.indexOf(a.s)-SO.indexOf(b.s)||(a.t||'99:99').localeCompare(b.t||'99:99')||a.n.localeCompare(b.n));

const ds=m=>m.d.length==7?'Todos los días':m.d.map(i=>DS[i][0]+DS[i].slice(1).toLowerCase()).join(', ');
function render(){
$('#seg').innerHTML=['week','month'].map(v=>`<button class="${v==view?'on':''}" data-a="view" data-v="${v}">${v=='week'?'Semana':'Mes'}</button>`).join('');
const ob=document.querySelector('.dc.s b'),ox=ob&&ob.getBoundingClientRect?ob.getBoundingClientRect().left:null;

const IC={m:'<circle cx="12" cy="15" r="4"/><path d="M12 5v3M3 15h2M19 15h2M5.6 8.6l1.5 1.5M18.4 8.6l-1.5 1.5"/>',t:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M5 19l1.4-1.4M17.6 6.4L19 5"/>',n:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>'};

function heroHTML(){

function weekHTML(){

let h=`<div class="nav"><button data-a="pw" aria-label="Semana anterior">‹</button><span>Semana del ${st.getDate()}${st.getMonth()!=en.getMonth()?' de '+MN[st.getMonth()]:''} al ${en.getDate()} de ${MN[en.getMonth()]}</span><button data-a="nw" aria-label="Semana siguiente">›</button></div><div class="strip">`;
for(let i=0;i<7;i++){const d=add(st,i),l=medsFor(d),n=l.length,dn=l.filter(m=>isDone(m,d)).length;
h+=`<button class="dc${same(d,today)?' t':''}${same(d,sel)?' s':''}" data-a="day" data-v="${key(d)}"><small>${DS[i][0]+DS[i].slice(1).toLowerCase()}</small><b>${d.getDate()}</b><i>${n?(tracked(d)?dn+'/'+n:n):'–'}</i></button>`}

const{l,isT,tr,pe,co}=info();
const row=(m,dn)=>`<div class="row${dn?' d':''}"><button class="ck${dn?' on':''}${isT?'':' off'}${ANIM===m.id?' pop':''}" data-a="chk" data-v="${m.id}" aria-label="Marcar ${esc(m.n)}">${dn?CK:''}</button><div class="info"><div class="n">${esc(m.n)}</div><div class="s2">${ds(m)}</div></div>${m.t?`<span class="tm">${m.t}</span>`:''}<button class="mo" data-a="edit" data-v="${m.id}" aria-label="Opciones de ${esc(m.n)}">⋯</button></div>`;
const slots=arr=>grp(arr,(x,a)=>{const z=l.filter(m=>m.s==x);return`<div class="grp"><div class="sl"><svg class="si" viewBox="0 0 24 24">${IC[x]}</svg><span>${SL[x]}</span><em>${tr?z.filter(m=>isDone(m,sel)).length+' de '+z.length:z.length}</em></div><div class="lst">${a.map(m=>row(m,isDone(m,sel))).join('')}</div></div>`});

function monthHTML(){
const y=vm.getFullYear(),mo=vm.getMonth(),off=dow(vm),len=new Date(y,mo+1,0).getDate();
let h=`<div class="nav"><button data-a="pm">‹</button><span>${MN[mo][0].toUpperCase()+MN[mo].slice(1)} ${y}</span><button data-a="nm">›</button></div><div class="mg">`+DL.map(x=>`<div class="mh">${x}</div>`).join('');
for(let i=0;i<off;i++)h+='<div></div>';
