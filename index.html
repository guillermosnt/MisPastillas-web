<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e9f8e"><title>Mis Pastillas</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pastillas">
<style>
:root{--bg:#f3f6f9;--card:#fff;--p:#0e9f8e;--pd:#0a7c6f;--ps:#e3f5f2;--t:#1e2a38;--m:#6c7a89;--l:#e3e9ef;--ok:#2fa463;--oks:#eaf7f0;--w:#d9822b;--ws:#fcf0df;--d:#d64545}
@media(prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#18222d;--t:#e8eef4;--m:#93a1b0;--l:#263341;--ps:#12332f;--pd:#5fd6c6;--oks:#12301f;--ws:#3a2a14}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.w{max-width:640px;margin:0 auto;padding:16px 16px 110px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}h1{font-size:22px;margin:0;flex:1}
.seg{display:flex;background:var(--card);border:1px solid var(--l);border-radius:12px;padding:3px}
.seg button{padding:7px 12px;border-radius:9px;font-weight:600;color:var(--m)}.seg .on{background:var(--p);color:#fff}
.pill{background:var(--ps);color:var(--pd);font-weight:700;padding:8px 12px;border-radius:12px}
.nav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px;font-weight:700}
.nav button{width:38px;height:34px;border:1px solid var(--l);background:var(--card);border-radius:10px;font-size:18px}
.strip,.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dc{background:var(--card);border:1px solid var(--l);border-radius:14px;padding:8px 0;text-align:center}
.dc small{display:block;font-size:10px;font-weight:700;color:var(--m)}.dc b{display:block;font-size:19px}.dc i{font-style:normal;font-size:11px;color:var(--m)}
.dc.t,.mc.t{border:2px solid var(--p)}.dc.s{background:var(--p);color:#fff;border-color:var(--p)}.dc.s small,.dc.s i{color:#ffffffd0}
.card{background:var(--card);border:1px solid var(--l);border-radius:18px;padding:16px;margin:14px 0}
.card h2{margin:0;font-size:19px}.card p{margin:2px 0 12px;color:var(--m);font-size:13px}
.bar{height:8px;background:var(--l);border-radius:8px;overflow:hidden}.bar div{height:100%;background:var(--p);border-radius:8px}
.sec{font-size:11px;font-weight:700;color:var(--m);letter-spacing:.04em;margin:16px 4px 8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--l);border-radius:16px;padding:12px;margin-bottom:8px}
.row.d{background:var(--oks)}.row.d .n{color:var(--m);text-decoration:line-through}
.ck{width:30px;height:30px;border-radius:50%;border:2.2px solid #b5c1cd;flex:none;color:#fff;font-weight:900}
.ck.on{background:var(--ok);border-color:var(--ok)}.ck.off{opacity:.45}
.info{flex:1;min-width:0}.n{font-weight:700;overflow:hidden;text-overflow:ellipsis}.s2{font-size:12px;color:var(--m)}
.mo{width:36px;height:36px;color:var(--m);font-size:20px}.note{color:var(--m);font-size:13px;margin:4px}
.mh{text-align:center;font-size:10px;font-weight:700;color:var(--m)}
.mc{min-height:58px;background:var(--card);border:1px solid var(--l);border-radius:11px;padding:5px 3px;text-align:center;font-size:13px;font-weight:600}
.mc em{display:block;font-style:normal;font-size:10px;margin-top:4px;border-radius:8px;padding:1px 0;background:var(--ps);color:var(--pd)}
.mc em.ok{background:var(--oks);color:var(--ok)}.mc em.bad{background:var(--ws);color:var(--w)}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(18px + env(safe-area-inset-bottom));background:var(--p);color:#fff;font-weight:700;padding:15px 22px;border-radius:30px;box-shadow:0 6px 18px #0e9f8e66}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.sh h3{margin:0 0 12px}.sh input{width:100%;padding:13px;margin-bottom:10px;border:1px solid var(--l);border-radius:12px;background:var(--bg);color:var(--t);font:inherit}
.dys{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 10px}
.dys button{aspect-ratio:1;border-radius:50%;background:var(--bg);color:var(--m);font-weight:700}.dys .on{background:var(--p);color:#fff}
.bt{width:100%;padding:14px;border-radius:14px;font-weight:700;background:var(--p);color:#fff;margin-top:4px}.bt.g{background:none;color:var(--m)}.bt.r{background:none;color:var(--d)}
.err{color:var(--d);font-size:13px;min-height:18px}.tip{background:var(--ps);color:var(--pd);border-radius:14px;padding:10px 14px;font-size:13px;margin-bottom:12px}
</style></head><body>
<div class="w"><div id="tip"></div><header><h1>Mis Pastillas</h1><button class="pill" data-a="hoy">Hoy</button><div class="seg" id="seg"></div></header><main id="app"></main></div>
<button class="fab" data-a="add">+ Añadir</button><div id="sheet"></div>
<script>
const $=s=>document.querySelector(s),K='pastillas.v1',pad=n=>String(n).padStart(2,'0');
const DN=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'],DS=['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'],DL=['L','M','X','J','V','S','D'],
MN=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),dow=d=>(d.getDay()+6)%7,same=(a,b)=>key(a)===key(b),
add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},parse=v=>{const[y,m,d]=v.split('-');return new Date(+y,m-1,+d)},
esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),pl=n=>n+(n==1?' pastilla':' pastillas');
let today=new Date();today.setHours(0,0,0,0);
let sel=new Date(today),view='week',vm=new Date(today.getFullYear(),today.getMonth(),1),F,ip,S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s&&s.meds)return s}catch(e){}
const a=[0,1,2,3,4,5,6];return{start:key(today),done:{},meds:[{id:'a1',n:'Vitamina D',t:'09:00',d:a},{id:'a2',n:'Hierro',t:'09:30',d:[0,2,4]},{id:'a3',n:'Vitamina B12',t:'10:00',d:[1,3]},{id:'a4',n:'Omega 3',t:'14:00',d:[0,1,3,5]},{id:'a5',n:'Calcio',t:'20:00',d:[3,5,6]},{id:'a6',n:'Magnesio',t:'22:00',d:a}]}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const medsFor=d=>S.meds.filter(m=>m.d.includes(dow(d))).sort((a,b)=>(a.t||'99:99').localeCompare(b.t||'99:99')||a.n.localeCompare(b.n));
const isDone=(m,d)=>(S.done[key(d)]||[]).includes(m.id),tracked=d=>key(d)>=S.start&&d<=today;
const ds=m=>m.d.length==7?'Todos los días':m.d.map(i=>DS[i][0]+DS[i].slice(1).toLowerCase()).join(', ');
function render(){
$('#seg').innerHTML=['week','month'].map(v=>`<button class="${v==view?'on':''}" data-a="view" data-v="${v}">${v=='week'?'Semana':'Mes'}</button>`).join('');
$('#app').innerHTML=view=='week'?weekHTML():monthHTML()}
function weekHTML(){
const st=add(sel,-dow(sel)),en=add(st,6);
let h=`<div class="nav"><button data-a="pw">‹</button><span>Semana del ${st.getDate()}${st.getMonth()!=en.getMonth()?' de '+MN[st.getMonth()]:''} al ${en.getDate()} de ${MN[en.getMonth()]}</span><button data-a="nw">›</button></div><div class="strip">`;
for(let i=0;i<7;i++){const d=add(st,i),l=medsFor(d),n=l.length,dn=l.filter(m=>isDone(m,d)).length;
h+=`<button class="dc${same(d,today)?' t':''}${same(d,sel)?' s':''}" data-a="day" data-v="${key(d)}"><small>${DS[i]}</small><b>${d.getDate()}</b><i>${n?(tracked(d)?dn+'/'+n:n):'–'}</i></button>`}
h+='</div>';
const l=medsFor(sel),isT=same(sel,today),tr=tracked(sel),pe=l.filter(m=>!isDone(m,sel)),co=l.filter(m=>isDone(m,sel)),
w=['Hoy','Mañana','Ayer'][[0,1,-1].indexOf(Math.round((sel-today)/864e5))];
h+=`<div class="card"><h2>${w?w+' · ':''}${DN[dow(sel)]} ${sel.getDate()} de ${MN[sel.getMonth()]}</h2><p>${!l.length?'Nada programado para este día':!tr?pl(l.length)+(l.length==1?' programada':' programadas'):isT&&!pe.length?'¡Todo completado por hoy!':co.length+' de '+l.length+' completadas'}</p>${tr&&l.length?`<div class="bar"><div style="width:${co.length/l.length*100}%"></div></div>`:''}</div>`;
const row=(m,dn)=>`<div class="row${dn?' d':''}"><button class="ck${dn?' on':''}${isT?'':' off'}" data-a="chk" data-v="${m.id}">${dn?'✓':''}</button><div class="info"><div class="n">${esc(m.n)}</div><div class="s2">${m.t?m.t+' · ':''}${ds(m)}</div></div><button class="mo" data-a="edit" data-v="${m.id}">⋯</button></div>`;
if(!l.length)h+='<p class="note">Añade una con el botón + y elige los días en que toca.</p>';
else if(!tr)h+=`<div class="sec">PROGRAMADAS · ${l.length}</div>`+l.map(m=>row(m,0)).join('');
else h+=`<div class="sec">${isT?'PENDIENTES':'SIN MARCAR'} · ${pe.length}</div>`+(pe.length?pe.map(m=>row(m,0)).join(''):'<p class="note">Todo al día.</p>')+`<div class="sec">COMPLETADAS · ${co.length}</div>`+(co.length?co.map(m=>row(m,1)).join(''):'<p class="note">Todavía ninguna.</p>');
if(!isT&&l.length)h+='<p class="note">Solo se pueden marcar las pastillas de hoy.</p>';
return h}
function monthHTML(){
const y=vm.getFullYear(),mo=vm.getMonth(),off=dow(vm),len=new Date(y,mo+1,0).getDate();
let h=`<div class="nav"><button data-a="pm">‹</button><span>${MN[mo][0].toUpperCase()+MN[mo].slice(1)} ${y}</span><button data-a="nm">›</button></div><div class="mg">`+DL.map(x=>`<div class="mh">${x}</div>`).join('');
for(let i=0;i<off;i++)h+='<div></div>';
for(let n=1;n<=len;n++){const d=new Date(y,mo,n),l=medsFor(d),c=l.length,dn=l.filter(m=>isDone(m,d)).length,tr=tracked(d),
cl=!tr?'':dn==c?'ok':same(d,today)?'':'bad';
h+=`<button class="mc${same(d,today)?' t':''}" data-a="day" data-v="${key(d)}">${n}${c?`<em class="${cl}">${tr?dn+'/'+c:c}</em>`:''}</button>`}
return h+'</div><p class="note">Toca un día para ver y marcar sus pastillas.</p>'}
function form(id){const m=S.meds.find(x=>x.id==id);F={id:m?m.id:null,d:m?[...m.d]:[0,1,2,3,4,5,6]};
$('#sheet').innerHTML=`<div class="ov" data-a="close"><div class="sh" data-a="none"><h3>${m?'Editar pastilla':'Nueva pastilla'}</h3><input id="fn" placeholder="Nombre (ej. Vitamina D)" maxlength="60" value="${m?esc(m.n):''}"><input id="ft" type="time" value="${m?m.t:''}"><b style="font-size:13px">Días que la toma</b><div class="dys">${DL.map((x,i)=>`<button class="${F.d.includes(i)?'on':''}" data-a="dy" data-v="${i}">${x}</button>`).join('')}</div><div class="err" id="er"></div><button class="bt" data-a="ok">Guardar</button>${m?'<button class="bt r" data-a="del">Eliminar</button>':''}<button class="bt g" data-a="close">Cancelar</button></div></div>`}
const A={
view:v=>{view=v;if(v=='month')vm=new Date(sel.getFullYear(),sel.getMonth(),1);render()},
hoy:()=>{sel=new Date(today);view='week';render()},day:v=>{sel=parse(v);view='week';render()},
pw:()=>{sel=add(sel,-7);render()},nw:()=>{sel=add(sel,7);render()},
pm:()=>{vm=new Date(vm.getFullYear(),vm.getMonth()-1,1);render()},nm:()=>{vm=new Date(vm.getFullYear(),vm.getMonth()+1,1);render()},
chk:v=>{if(!same(sel,today))return;const k=key(sel),a=S.done[k]||(S.done[k]=[]),i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);save();render()},
add:()=>form(),edit:v=>form(v),close:()=>{$('#sheet').innerHTML=''},
dy:(v,b)=>{const i=+v,j=F.d.indexOf(i);j<0?F.d.push(i):F.d.splice(j,1);b.classList.toggle('on')},
ok:()=>{const n=$('#fn').value.trim(),t=$('#ft').value;if(!n)return $('#er').textContent='Escribe el nombre.';if(!F.d.length)return $('#er').textContent='Elige al menos un día.';
const d=[...F.d].sort((a,b)=>a-b);if(F.id)Object.assign(S.meds.find(x=>x.id==F.id),{n,t,d});else S.meds.push({id:Date.now().toString(36),n,t,d});save();A.close();render()},
del:()=>{if(!confirm('¿Eliminar esta pastilla de todos los días?'))return;S.meds=S.meds.filter(x=>x.id!=F.id);save();A.close();render()},
inst:()=>{ip&&ip.prompt();$('#tip').innerHTML=''},tipx:()=>{try{localStorage.setItem('tipx',1)}catch(e){}$('#tip').innerHTML=''}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');b&&A[b.dataset.a]&&A[b.dataset.a](b.dataset.v,b)});
function tick(){const n=new Date();n.setHours(0,0,0,0);if(!same(n,today)){const f=same(sel,today);today=n;if(f)sel=new Date(n);render()}}
setInterval(tick,30000);document.addEventListener('visibilitychange',tick);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('#tip').innerHTML='<div class="tip">Instala la app en tu móvil. <button class="pill" data-a="inst">Instalar</button></div>'});
try{if(/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone&&!localStorage.getItem('tipx'))$('#tip').innerHTML='<div class="tip">Para instalar: toca Compartir y luego «Añadir a pantalla de inicio». <button data-a="tipx"><b>OK</b></button></div>'}catch(e){}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
render();
</script></body></html>
